name: Create Release ZIP

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Archive
        run: |
          rm -rf Artisan
          mkdir -p Artisan
          rsync -av . Artisan --exclude .git --exclude .github --exclude Artisan --exclude Artisan.zip
          zip -r Artisan.zip Artisan

      - name: Update Latest Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          name: "Latest Version"
          body: |
            ${{ github.event.head_commit.message }}

            _Обновлено автоматически: ${{ github.event.head_commit.timestamp }}_
          artifacts: "Artisan.zip"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          draft: false
          prerelease: false
          makeLatest: true